<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AMZN harness</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/companies.css">
<link rel="stylesheet" href="css/overview.css">
<link rel="stylesheet" href="css/avgo.css">
<link rel="stylesheet" href="css/semi-map.css">
<link rel="stylesheet" href="css/industry.css">
<link rel="stylesheet" href="css/results.css">
<link rel="stylesheet" href="css/hyperscalers.css">
<style>
  body { background:#fff; margin:0; padding:18px 24px; font-family:Inter,system-ui,sans-serif; }
  #harness { max-width:1180px; margin:0 auto; }
  .hx-bar { max-width:1180px; margin:0 auto 14px; display:flex; gap:8px; align-items:center; font-size:12px; }
  .hx-bar button { font:inherit; padding:4px 10px; border:1px solid #d7dbe2; background:#fff; border-radius:6px; cursor:pointer; }
  .hx-bar button.on { background:#0f172a; color:#fff; border-color:#0f172a; }
</style>
</head>
<body>
<div class="hx-bar">
  <strong>AMZN harness</strong>
  <button type="button" id="hx-ov" class="on">Overview</button>
  <button type="button" id="hx-dd" class="on">Deep Dive</button>
  <span id="hx-status" style="color:#64748b"></span>
</div>
<div id="co-detailview">
  <div id="harness">
    <div class="copane active" data-pane="overview" id="hx-pane-ov"></div>
    <div class="copane active" data-pane="deepdive" id="hx-pane-dd"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<script src="env.js"></script>
<script type="module">
  // Optional local-only mock for get-market-history (?mockmarket=1), so Historic Multiple can be
  // eyeballed before San/Oscar deploy the real edge function. Patches BEFORE amzn.js imports, so
  // it's in place before the pane's own lazy loader can race it with a real (failing) request.
  // Wired via css/earnings.css-adjacent convention: temporary, not meant to be left in.
  if (new URLSearchParams(location.search).has('mockmarket')) {
    const { supabase } = await import('./js/supabase-client.js');
    // supabase.functions is a GETTER that builds a fresh client each access (identity check
    // fails: `supabase.functions === supabase.functions` is false) — patching the INSTANCE's
    // .invoke is a no-op the moment anything re-reads .functions. Patch the shared PROTOTYPE
    // instead, so every future instance picks up the override via normal method lookup.
    const proto = Object.getPrototypeOf(supabase.functions);
    const origInvoke = proto.invoke;
    function mulberry32(seed){ return function(){ seed|=0; seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^(seed>>>15),1|seed); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
    const rnd = mulberry32(20260908);
    function businessDays(fromStr, toStr){ const out=[]; let d=new Date(fromStr+'T00:00:00Z'); const end=new Date(toStr+'T00:00:00Z'); while(d<=end){ const dow=d.getUTCDay(); if(dow!==0&&dow!==6) out.push(new Date(d)); d.setUTCDate(d.getUTCDate()+1);} return out; }
    const START='2022-10-03', TODAY=new Date().toISOString().slice(0,10);
    const days = businessDays(START, TODAY);
    let price = 102;
    const prices = days.map((d,i)=>{ const drift=0.00075, shock=(rnd()-0.5)*0.035, cycle=Math.sin(i/90)*0.01; price=Math.max(60, price*(1+drift+shock+cycle)); return { t:d.getTime(), c:Math.round(price*100)/100 }; });
    const ratios = [];
    let fy=2022, q=4; const lastFy=+TODAY.slice(0,4), lastQ=Math.ceil(+TODAY.slice(5,7)/3);
    while (fy<lastFy || (fy===lastFy && q<=lastQ)){
      const idx = Math.floor(((fy-2022)*4+(q-4)) / ((lastFy-2022)*4+(lastQ-4)) * (prices.length-1));
      const p = prices[Math.max(0,Math.min(prices.length-1,idx))].c;
      const shares = 10450 + (fy-2022)*90 + q*5;
      const marketCap = p*shares*1e6;
      const netDebtM = -20000 + Math.sin(fy*4+q)*15000;
      ratios.push({ fiscal_year:fy, fiscal_period:'Q'+q, price:p, market_cap:marketCap, enterprise_value:marketCap+netDebtM*1e6 });
      q++; if(q>4){ q=1; fy++; }
    }
    ratios.reverse();
    proto.invoke = async function(name, opts){
      if (name === 'get-market-history'){
        const body = (opts && opts.body) || {};
        if (body.resource === 'prices') return { data: { results: prices }, error: null };
        if (body.resource === 'ratios') return { data: { results: ratios.slice(0, body.limit || 20) }, error: null };
      }
      return origInvoke.call(this, name, opts);
    };
    console.log('[harness] get-market-history MOCKED for local preview —', prices.length, 'price points,', ratios.length, 'ratio rows');
  }
  const m = await import('./js/overviews/amzn.js');
  const ov = m.amznOverview;
  const c = { id: 'harness-amzn', ticker: 'AMZN', name: 'Amazon.com, Inc.' };
  const povr = document.getElementById('hx-pane-ov');
  const pdd  = document.getElementById('hx-pane-dd');
  povr.innerHTML = ov.html(c);
  pdd.innerHTML  = ov.deepDive ? ov.deepDive.html(c) : '<em>no deepDive</em>';
  ov.init(c);
  if (ov.deepDive && ov.deepDive.init) ov.deepDive.init(c);
  window.__ov = ov; window.__c = c;
  const st = document.getElementById('hx-status');
  st.textContent = 'mounted · overview ' + povr.innerHTML.length + ' chars · deepdive ' + pdd.innerHTML.length + ' chars';
  function toggle(btn, el){ btn.addEventListener('click', function(){
    const on = btn.classList.toggle('on'); el.style.display = on ? '' : 'none'; }); }
  toggle(document.getElementById('hx-ov'), povr);
  toggle(document.getElementById('hx-dd'), pdd);
  console.log('[harness] amzn mounted');
</script>
</body>
</html>
