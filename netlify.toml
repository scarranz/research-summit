[build]
  publish = "."
  command = "printf 'window.ENV = { SUPABASE_URL: \"%s\", SUPABASE_ANON_KEY: \"%s\" };\n' \"$SUPABASE_URL\" \"$SUPABASE_ANON_KEY\" > env.js"

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://assets.parqet.com https://www.google.com https://*.supabase.co data:; connect-src 'self' https://*.supabase.co https://*.supabase.in; frame-ancestors 'none'"
