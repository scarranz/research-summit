[build]
  publish = "."
  command = "printf 'window.ENV = { SUPABASE_URL: \"%s\", SUPABASE_ANON_KEY: \"%s\" };\n' \"$SUPABASE_URL\" \"$SUPABASE_ANON_KEY\" > env.js"

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
